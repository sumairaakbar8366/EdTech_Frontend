<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5ea" />
    <meta name="description" content="EdTech runs your whole school online: admissions, attendance, fees, exams and results, timetable, payroll, and parent, student and teacher portals. Start a free trial today." />
    <title>EdTech: School Management Software in Pakistan | Free Trial</title>
    <link rel="icon" type="image/png" href="/brand/edtech-logo.png" />
    <link rel="apple-touch-icon" href="/brand/edtech-logo.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var pref = 'light';
        try {
          pref = localStorage.getItem('schoolerp-theme') || 'light';
        } catch (e) {}
        var dark = pref === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
