<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5ea" />
    <meta name="description" content="SchoolERP by Anet Cyber Solutions: secure school operations, academics, attendance and admissions." />
    <title>SchoolERP | Anet Cyber Solutions</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var pref = 'light';
        try {
          pref = localStorage.getItem('schoolerp-theme') || 'light';
        } catch (e) {}
        var dark = pref === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
